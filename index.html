<style>
:root{--bg:#0a0b0d;--ink:#eceef2;--mute:#8f96a0;--fine:#b9bec6;--rule:#ffffff1c;--accent:#6b97ff;--accent-ink:#050b18;--scrim:10,11,13;--btn:#6b97ff;--alt:#ffffff0d;
--text:"Hanken Grotesk",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#e3d2b4;--ink:#1e1912;--mute:#5a4e3d;--fine:#3b3227;--rule:#1e191229;--accent:#8a3c0c;--accent-ink:#fff4e6;--scrim:227,210,180;--btn:#8a3c0c;--alt:#1e19120d;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
html{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--text);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{position:fixed;inset:0;z-index:0;touch-action:manipulation}
.stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.veil{position:fixed;inset:0;z-index:30;background:var(--bg);pointer-events:none;transition:opacity .8s cubic-bezier(.22,1,.36,1)}
.veil.off{opacity:0}

/* the corner: name in spaced mono caps and the role; the drawers in the cabinet are the navigation, the icon row sits bottom-left */
.side{position:fixed;z-index:6;left:0;top:0;bottom:0;width:300px;display:flex;flex-direction:column;padding:30px 22px 22px 32px;pointer-events:none}
.side>*{pointer-events:auto}
.who{display:flex;flex-direction:column}
.name{display:inline-flex;flex-direction:column;align-self:flex-start;min-height:44px;justify-content:center;text-decoration:none;font:400 16px/1.45 var(--mono);letter-spacing:.32em;text-transform:uppercase}
.name:hover{color:var(--accent)}
.name{transition:color .2s}
.role{margin:12px 0 26px;font:300 13px/1.5 var(--mono);color:var(--mute);letter-spacing:.02em}
.list{display:flex;flex-direction:column}
.list a{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font:400 14.5px/1.2 var(--mono);letter-spacing:.08em;color:var(--mute);transition:color .3s,padding .3s}
.list a i{margin-left:auto;font:400 12px/1 var(--mono);font-style:normal;letter-spacing:.06em;color:var(--mute)}
.list a:hover,.list a[aria-current]{color:var(--accent);padding-left:16px}
.list a[aria-current]::before{content:"";position:absolute;left:0;top:50%;width:7px;height:7px;margin-top:-4px;background:var(--accent)}
.links{margin-top:auto;display:flex;flex-wrap:nowrap;align-items:center;gap:0;margin-left:-12px}
.links a,.links button{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;color:var(--mute);transition:color .2s}
.links a:hover,.links button:hover{color:var(--accent)}
.links svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="light"] .theme .sun{display:block}:root[data-theme="light"] .theme .moon{display:none}

/* the section, floating on the right; the arm stays in the middle */
.rscrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(270deg,rgba(var(--scrim),.95) 0%,rgba(var(--scrim),.8) 27%,rgba(var(--scrim),0) 45%);opacity:0;transition:opacity .35s cubic-bezier(.22,1,.36,1)}
body:not([data-view="home"]) .rscrim{opacity:1}
.panel{position:fixed;z-index:4;right:36px;top:36px;bottom:36px;width:min(520px,35vw);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.view{pointer-events:auto;max-height:100%;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 24px;background:rgba(var(--scrim),.84);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--rule);scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.view.in{animation:vin .3s cubic-bezier(.22,1,.36,1) both}
.view.out{position:absolute;animation:vout .2s cubic-bezier(.16,1,.3,1) both;pointer-events:none}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vout{from{opacity:1}to{opacity:0;transform:translateY(-6px)}}
.k{display:flex;align-items:center;gap:10px;font:400 13px/1.2 var(--mono);color:var(--mute);margin-bottom:16px;letter-spacing:.08em;text-transform:uppercase}
.k::before{content:"";width:7px;height:7px;background:var(--accent)}
.k b{font-weight:500;color:var(--accent)}
.k .home{margin:-14px -10px -14px auto;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 10px;font:400 13px/1 var(--mono);letter-spacing:.08em;text-transform:lowercase;color:var(--accent);text-decoration:none;transition:opacity .2s}
.k .home:hover{opacity:.75}
.ph{margin:0 0 16px;overflow:hidden;background:#0002}
.ph img{width:100%;height:auto;max-height:38vh;object-fit:cover}
.view h2{font:700 clamp(32px,3vw,46px)/1.05 var(--text);letter-spacing:-.02em;overflow-wrap:anywhere}
.meta{margin-top:8px;font-size:15px;color:var(--fine)}
.desc{margin-top:12px;font-size:16px;line-height:1.58;max-width:44ch}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.go,.alt{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;font:500 14px/1 var(--mono);letter-spacing:.06em;text-decoration:none;transition:transform .16s cubic-bezier(.23,1,.32,1),filter .2s,background .2s}
.go{background:var(--btn);color:var(--accent-ink)}
.alt{background:var(--alt);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.go:hover{filter:brightness(1.08)}.alt:hover{color:var(--accent)}
.go:active,.alt:active{transform:scale(.97)}
.list2{margin-top:14px;border-top:1px solid var(--rule)}
.list2>*{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:48px;padding:9px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.list2 b{font-weight:600;font-size:16px;line-height:1.28}
.list2 span{font-size:13.5px;line-height:1.42;color:var(--fine)}
.list2 a:hover b{color:var(--accent)}
.list2 .pl{font:400 12px/1 var(--mono);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.list2 .pl.first{color:var(--accent)}
.hint{margin:18px 0 0;white-space:nowrap;font:400 12.5px/1.6 var(--mono);color:var(--mute);letter-spacing:.04em;transition:opacity .3s}
body:not([data-view="home"]) .hint{opacity:0}

.kit-toast{position:fixed;left:50%;bottom:24px;z-index:45;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);font:400 14px/1.3 var(--mono);padding:13px 18px;transition:opacity .25s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none}
.kit-toast.is-on{opacity:1;transform:translate(-50%,0)}

  .list::-webkit-scrollbar{display:none}
  .list a{flex:none;font-size:13.5px;scroll-snap-align:center}
  .list a i{margin-left:0}
  .links{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom));margin:0;flex-wrap:nowrap}
  body:not([data-view="home"]) .links{display:none}
  .rscrim{display:none}
  .panel{left:0;right:0;top:auto;bottom:calc(52px + env(safe-area-inset-bottom));width:auto;height:auto;max-height:58svh;display:block;padding:16px 18px 12px;background:linear-gradient(rgba(var(--scrim),.88),rgba(var(--scrim),.97) 40%);transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .25s}
  body[data-view="home"] .panel{transform:translateY(30px);opacity:0;pointer-events:none}
  .view{max-height:calc(58svh - 28px);padding:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
  .ph img{max-height:23svh}
  .ph{margin-bottom:10px}
  .view h2{font-size:28px}
  .desc{font-size:15px}
  .go,.alt{min-height:44px;padding:0 14px;font-size:13px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.topfade{display:none}
@media (max-width:760px){.topfade{display:block;position:fixed;z-index:5;left:0;right:0;top:0;height:104px;pointer-events:none;background:linear-gradient(rgba(var(--scrim),.96),rgba(var(--scrim),.9) 66%,rgba(var(--scrim),0))}}
html.nogl .stage{background:url(images/arm-2.jpg) 60% 50%/auto 80vh no-repeat,var(--bg)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import { studio, lights, canvasTex, rng, follow, rounded, lumpy, grime, drift, contact, T } from "./js/studio.js";

const K = KIT, E = K.esc, $ = (s) => document.querySelector(s);
const RM = () => K.reduced();
const PI = Math.PI;

/* ============ the 9 axes: each one is a section of the site ============ */
const SECS = [
  { id: "index-cabinet", ax: "G", part: "three-finger gripper" },
  { id: "fetch", ax: "J1", part: "base turntable" },
  { id: "ceres", ax: "J2", part: "shoulder" },
  { id: "sweeper", ax: "J3", part: "upper-arm roll" },
  { id: "recall", ax: "J4", part: "elbow" },
  { id: "builds", ax: "J5", part: "forearm roll" },
  { id: "software", ax: "J6", part: "wrist pitch" },
  { id: "now", ax: "J7", part: "wrist roll" },
  { id: "awards", ax: "B", part: "base plate" },
];
const titleOf = (id) => id === "builds" ? K.groups.builds.title : id === "software" ? K.groups.software.title : id === "now" ? "Currently" : id === "awards" ? "Awards" : (K.byId(id) || {}).title;
const secOf = (r) => { if (!r) return null; const s = SECS.find((x) => x.id === r); if (s) return s; const p = K.byId(r); if (p && p.group !== "main") return SECS.find((x) => x.id === p.group); return null; };

/* ============ the arm ============ */
const R = rng(7);
const V2 = (x, y) => new T.Vector2(x, y), V3 = (x, y, z) => new T.Vector3(x, y, z);
let SEC = null;                                  // section tag stamped on every mesh made, for tapping a joint
const ringMats = {};                              // one glowing accent material per section
const anchors = {};

function add(p, geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new T.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; if (SEC) m.userData.sec = SEC; p.add(m); return m;
}
const grp = (p, x = 0, y = 0, z = 0) => { const g = new T.Group(); g.position.set(x, y, z); p.add(g); return g; };

// a lathe from (r, y) points
const lathe = (pts, seg = 64) => new T.LatheGeometry(pts.map(([r, y]) => V2(Math.max(r, 0.0004), y)), seg);
// a smooth shell: a spline through (r, y) stations, with rounded fillets at both ends, closed on the axis
function prof(st, f0 = 0.03, f1 = 0.03, n = 40) {
  const y0 = st[0][1], y1 = st.at(-1)[1];
  const sp = new T.SplineCurve(st.map(([r, y]) => V2(r, y))).getSpacedPoints(n);
  const rAt = (y) => { for (let i = 1; i < sp.length; i++) if (sp[i].y >= y) { const a = sp[i - 1], b = sp[i], t = (y - a.y) / Math.max(1e-6, b.y - a.y); return a.x + (b.x - a.x) * t; } return sp.at(-1).x; };
  const pts = [[0, y0]];
  const ra = rAt(y0 + f0), rb = rAt(y1 - f1);
  if (f0 > 0) for (let i = 0; i <= 7; i++) { const a = -PI / 2 + (i / 7) * PI / 2; pts.push([ra - f0 + Math.cos(a) * f0, y0 + f0 + Math.sin(a) * f0]); } else pts.push([ra, y0]);
  for (const p of sp) if (p.y > y0 + f0 + 0.004 && p.y < y1 - f1 - 0.004) pts.push([p.x, p.y]);
  if (f1 > 0) for (let i = 0; i <= 7; i++) { const a = (i / 7) * PI / 2; pts.push([rb - f1 + Math.cos(a) * f1, y1 - f1 + Math.sin(a) * f1]); } else pts.push([rb, y1]);
  pts.push([0, y1]);
  return pts;
}
const shell = (st, f0, f1, seg = 72) => lathe(prof(st, f0, f1), seg);
// the radius of a shell's spline at height y, so bands and labels sit right on the surface
const rOf = (st, y) => { const sp = new T.SplineCurve(st.map(([r, yy]) => V2(r, yy))).getSpacedPoints(120); for (let i = 1; i < sp.length; i++) if (sp[i].y >= y) { const a = sp[i - 1], b = sp[i], t = (y - a.y) / Math.max(1e-6, b.y - a.y); return a.x + (b.x - a.x) * t; } return sp.at(-1).x; };
// a big flat black end cap on a joint drum, facing +Y: a bevelled disc, a fine parting groove and a small centre plug
function endCap(p, Rr, t = 0.05) {
  add(p, lathe([[0, 0], [Rr - 0.02, 0], [Rr - 0.004, 0.01], [Rr, t * 0.45], [Rr - 0.006, t - 0.008], [Rr - 0.022, t], [0, t]], 96), BLACK);
  add(p, new T.TorusGeometry(Rr * 0.8, 0.0035, 4, 96), RUB, 0, t + 0.0005, 0, false).rotation.x = PI / 2;
  add(p, lathe([[0, t], [Rr * 0.16, t], [Rr * 0.165, t + 0.006], [Rr * 0.15, t + 0.012], [0, t + 0.012]], 48), ANOD);
}
// a drum along X from x0 to x1 with its own fillet at each end

// fdm layer lines for the printed gripper

// an accent ring with a rubber gasket under it

const SH = new T.CylinderGeometry(0.03, 0.031, 0.028, 20), HX = new T.CylinderGeometry(0.014, 0.014, 0.006, 6);
function screw(p, x, y, z, s = 1, rot) {

}
function boltCircle(p, n, rr, y, s = 1, skip) { for (let i = 0; i < n; i++) { const a = (i + 0.5) / n * PI * 2; if (skip && skip(a)) continue; screw(p, Math.sin(a) * rr, y, Math.cos(a) * rr, s); } }

function decal(p, text, Rr, h, arc, along) {

/* ---------- a NEMA 17 stepper: rear cap at y=0, shaft along +Y ---------- */

/* ============ build ============ */
function makeArm(scene) {
  const root = grp(scene, 0, 0.032, 0);

  /* ---------- base (Awards): a square black mounting plate, a black turntable ring, edges worn to bare metal ---------- */
  SEC = "awards";
  const PW = 2.9, PH = 0.24, BELT = 1.277;
  const rrect = (w, r) => { const h = w / 2, s = new T.Shape(); s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.absarc(h - r, -h + r, r, -PI / 2, 0); s.lineTo(h, h - r); s.absarc(h - r, h - r, r, 0, PI / 2); s.lineTo(-h + r, h); s.absarc(-h + r, h - r, r, PI / 2, PI); s.lineTo(-h, -h + r); s.absarc(-h + r, -h + r, r, PI, PI * 1.5); return s; };

    }

  });

    g.font = "500 30px 'DM Mono', monospace"; g.fillText("7-AXIS ARM · 12 V · NEMA 17", 290, 98);
    g.fillText("BUILT BY VARUN CHILUKURI · SAN JOSE", 70, 168); g.fillText("S/N 0007", 70, 214);

  for (const [cx, cz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) add(j1m, new T.CylinderGeometry(0.03, 0.03, 0.357, 6), ALUF, cx * 0.17, 0.2285, cz * 0.17);
  add(j1m, rounded(0.47, 0.03, 0.47, 0.01, 2), ALUF, 0, 0.422, 0);

  const g7 = grp(g6, 0.72, 0.47, 0); g7.userData.ax = "y";

// a torn strip of cream masking tape with a name in dark-blue marker: uneven ink, paper fibre, ragged ends
function paintTape(g, W, H, name, ax, fs, seed) {
  const r = rng(seed); g.clearRect(0, 0, W, H);
  const y0 = 16, y1 = H - 16, rag = (x0, dir) => { for (let y = y0; y <= y1; y += 11) g.lineTo(x0 + dir * r() * 12, y); };
  g.beginPath(); g.moveTo(10, y0); g.lineTo(W - 10, y0); rag(W - 10, -1); g.lineTo(10, y1); for (let y = y1; y >= y0; y -= 11) g.lineTo(10 + r() * 12, y); g.closePath();
  const tg = g.createLinearGradient(0, y0, 0, y1); tg.addColorStop(0, "#ece3cb"); tg.addColorStop(0.5, "#e6dcc2"); tg.addColorStop(1, "#ddd2b6");
  g.fillStyle = tg; g.fill();
  g.save(); g.clip();
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${r() < 0.5 ? "120,100,60" : "255,250,235"},${0.05 + r() * 0.08})`; g.fillRect(r() * W, r() * H, 1 + r() * 3, 0.6 + r()); }   // crepe and fibre
  for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(150,130,90,${0.04 + r() * 0.05})`; g.fillRect(0, y0 + r() * (y1 - y0), W, 1 + r() * 2); }
  // marker: two passes slightly offset, then a few dry spots, so the ink isn't one flat black
  g.textBaseline = "middle"; g.font = `700 ${fs}px Kalam, 'Comic Sans MS', cursive`;
  const tx = 42, ty = H / 2 + 6;
  g.fillStyle = "rgba(28,32,48,0.86)"; g.fillText(name, tx, ty);
  g.fillStyle = "rgba(20,24,40,0.35)"; g.fillText(name, tx + 1.5, ty + 1);
  g.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(0,0,0,${0.12 + r() * 0.25})`; g.beginPath(); g.arc(tx + r() * (W - 90), ty - fs * 0.35 + r() * fs * 0.7, 0.6 + r() * 1.7, 0, 7); g.fill(); }
  g.globalCompositeOperation = "source-over";
  g.font = `700 ${Math.round(fs * 0.42)}px Kalam, 'Comic Sans MS', cursive`; g.fillStyle = "rgba(60,64,78,0.75)"; g.textAlign = "right"; g.fillText(ax, W - 30, y0 + fs * 0.3); g.textAlign = "left";
  g.restore();
}

/* ============ the parts cabinet: one drawer per section, within the arm's reach behind its left shoulder ============ */
const CAB_AT = 4.95, CAB_R = 9.1, CAB_FACE = 1.4;   // to the arm's left, clear of its idle sweep; its front turned a little toward you         // bearing (radians, from +Z toward +X) and distance from the base; its front faces the arm
function buildCabinet(root) {
  const SC = 1.5, W = 3.16, D = 1.35, PLH = 0.76, DY = PLH - 0.45, BH = 2.14, FW = 0.96, FH = 0.62, TL = 1.1, PULL = 0.8;   // a drawer slides out ~60% of the cabinet's depth
  const C = V3(Math.sin(CAB_AT) * CAB_R, 0, Math.cos(CAB_AT) * CAB_R), n = V3(Math.sin(CAB_FACE), 0, Math.cos(CAB_FACE)), yaw = CAB_FACE;
  const cg = grp(root, C.x, 0, C.z); cg.rotation.y = yaw; cg.scale.setScalar(SC);
  const CAB = worn(P({ color: drift(0x1d1f23, 0.03, R), metalness: 0.2, clearcoat: 0.25, clearcoatRoughness: 0.5, bumpMap: peel, bumpScale: 0.25 }), { base: 0.5, prints: 6, scratches: 180, dust: 600, seed: 81 });
  const INNER = S({ color: 0x141518, roughness: 0.8 });
  const ACC = S({ color: 0x3d7bff, roughness: 0.42, metalness: 0.1 });   // follows the theme: blue in the dark room, burnt orange in the light one
  const FOAM = S({ color: 0x9a9890, roughness: 0.95 }), PCB = S({ color: 0x1f5a3a, roughness: 0.5, metalness: 0.1 });
  // quiet fronts: dark bead-blasted anodised aluminium, each from its own batch
  const FRONTS = [0, 1, 2].map((k) => worn(P({ color: drift(0x30333a, 0.04, R), metalness: 0.65, clearcoat: 0.1, clearcoatRoughness: 0.5 }), { base: 0.46, prints: 4, scratches: 120, dust: 300, seed: 82 + k, bump: 0.06 }));
  SEC = null;
  add(cg, rounded(W, BH, 0.04, 0.015, 2), CAB, 0, PLH + BH / 2, -D / 2 + 0.02);
  for (const sx of [-1, 1]) add(cg, rounded(0.05, BH, D, 0.02, 2), CAB, sx * (W / 2 - 0.025), PLH + BH / 2, 0);
  add(cg, rounded(W + 0.05, 0.06, D + 0.05, 0.025, 3), CAB, 0, PLH + BH - 0.005, 0);
  add(cg, rounded(W, 0.05, D, 0.02, 2), CAB, 0, PLH + 0.025, 0);
  for (const x of [-0.51, 0.51]) add(cg, new T.BoxGeometry(0.03, BH - 0.1, D - 0.05), INNER, x, PLH + BH / 2, -0.02);
  for (const y of [1.86 + DY, 1.18 + DY]) add(cg, new T.BoxGeometry(W - 0.1, 0.03, D - 0.05), INNER, 0, y, -0.02);
  add(cg, rounded(W - 0.16, PLH - 0.08, D - 0.16, 0.03, 2), BLACK, 0, PLH / 2 + 0.04, 0);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(cg, new T.CylinderGeometry(0.07, 0.08, 0.08, 20), RUB, sx * (W / 2 - 0.22), 0.04, sz * (D / 2 - 0.2));   // little rubber feet
  // the maker's plate on the kick-plate
  const mp = canvasTex(512, 128, (g, Wc, Hc) => { g.fillStyle = "#b9bdc2"; g.fillRect(0, 0, Wc, Hc); speckle(g, Wc, Hc, 1500, 0.06, 1); g.fillStyle = "#25272c"; g.font = "600 46px 'DM Mono', monospace"; g.textBaseline = "middle"; g.fillText("VC PARTS · 9 BINS", 26, Hc / 2 + 2); for (const x of [12, Wc - 12]) { g.fillStyle = "#6c7076"; g.beginPath(); g.arc(x, Hc / 2, 6, 0, 7); g.fill(); } });
  add(cg, new T.PlaneGeometry(0.7, 0.175), P({ map: mp, metalness: 0.85, roughness: 0.35 }), 0, PLH / 2 + 0.03, D / 2 - 0.075, false);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) screw(cg, sx * (W / 2 - 0.06), PLH + BH + 0.025, sz * (D / 2 - 0.06), 0.6);
  const sh = contact((W + 0.4) * SC, (D + 0.4) * SC, { dark: 0.8 }); sh.position.set(C.x, 0.034, C.z); sh.rotation.z = yaw; root.add(sh);
  const drawers = {}, labels = [];
  SECS.forEach((s, i) => {
    const c = i % 3, r = (i / 3) | 0;
    SEC = s.id;
    const dg = grp(cg, (c - 1) * 1.02, 2.2 + DY - r * 0.68, 0);
    add(dg, rounded(FW, FH, 0.05, 0.014, 2), FRONTS[i % 3], 0, 0, D / 2 - 0.03);
    // the tray: bright folded aluminium, a pale foam insert and the part it keeps, so an open drawer reads at a glance
    const ty = -FH / 2 + 0.07, tz = D / 2 - 0.055 - TL / 2;
    add(dg, new T.BoxGeometry(FW - 0.08, 0.02, TL), ALUF, 0, ty, tz, false);
    for (const sx of [-1, 1]) add(dg, new T.BoxGeometry(0.02, FH - 0.24, TL), ALUF, sx * (FW / 2 - 0.05), ty + (FH - 0.24) / 2, tz, false);
    add(dg, new T.BoxGeometry(FW - 0.08, FH - 0.24, 0.02), ALUF, 0, ty + (FH - 0.24) / 2, D / 2 - 0.055 - TL, false);
    add(dg, new T.BoxGeometry(FW - 0.14, 0.06, TL - 0.06), FOAM, 0, ty + 0.04, tz, false);
    add(dg, rounded(0.36, 0.05, 0.28, 0.012, 1), PCB, -0.12 + (i % 2) * 0.2, ty + 0.095, D / 2 - 0.34, false);
    add(dg, rounded(0.16, 0.09, 0.16, 0.02, 1), BLACK, 0.22 - (i % 3) * 0.1, ty + 0.115, D / 2 - 0.62, false);
    // the label: a strip of masking tape on the aluminium holder, the section's name written on it in marker (see paintTape)
    const lt = canvasTex(768, 232, () => {}); labels.push({ tex: lt, name: titleOf(s.id), ax: s.ax, seed: 11 + i * 7 });
    lt.anisotropy = 8;
    add(dg, rounded(0.9, 0.3, 0.012, 0.004, 1), ALUF, 0, 0.135, D / 2 - 0.0, false);
    { const tp = add(dg, new T.PlaneGeometry(0.86, 0.26), S({ map: lt, roughness: 0.85, transparent: true, alphaTest: 0.05 }), 0, 0.135, D / 2 + 0.0075, false); tp.rotation.z = (R() - 0.5) * 0.05; }   // stuck on by hand: a degree or two off
    add(dg, new T.BoxGeometry(0.9, 0.014, 0.016), ACC, 0, -0.022, D / 2 + 0.004, false);   // a hairline of the arm's accent under each plate
    // a bar handle on two posts; it glows softly when the drawer is pointed at or focused
    const hm = ALUF.clone(); hm.emissive = new T.Color(0x000000);
    const bar = add(dg, new T.CylinderGeometry(0.024, 0.024, 0.52, 16), hm, 0, -0.17, D / 2 + 0.13); bar.rotation.z = PI / 2;
    for (const sx of [-1, 1]) { const p = add(dg, new T.CylinderGeometry(0.02, 0.022, 0.14, 12), hm, sx * 0.22, -0.17, D / 2 + 0.065); p.rotation.x = PI / 2; }
    for (const sx of [-1, 1]) { const c = add(dg, new T.CylinderGeometry(0.03, 0.03, 0.03, 16), ACC, sx * 0.275, -0.17, D / 2 + 0.13, false); c.rotation.z = PI / 2; }
    const h = new T.Object3D(); h.position.set(0, -0.17, D / 2 + 0.13); dg.add(h);
    drawers[s.id] = { g: dg, h, hm, open: 0 };
  });
  SEC = null;
  // marker on masking tape, all nine at one shared size (the longest name sets it), drawn once the handwriting font is in
  const paintAll = () => {
    const probe = document.createElement("canvas").getContext("2d"); probe.font = "700 100px Kalam, 'Comic Sans MS', cursive";
    const widest = Math.max(...labels.map((l) => probe.measureText(l.name).width));
    const fs = Math.floor(Math.min(150, (100 * (768 - 112)) / widest));
    for (const l of labels) { const g = l.tex.image.getContext("2d"); paintTape(g, 768, 232, l.name, l.ax, fs, l.seed); l.tex.needsUpdate = true; }
  };
  paintAll();
  if (document.fonts && document.fonts.load) document.fonts.load("700 100px Kalam").then(paintAll, () => {});
  return { cg, drawers, n, yaw, C, acc: ACC, W: W * SC, D: D * SC, H: (PLH + BH) * SC, PULL: PULL * SC, set(id, v) { const d = drawers[id]; d.open = v; d.g.position.z = v * PULL; } };
}

/* ---------- helical gear: an extruded tooth outline twisted along its width ---------- */
function gearGeo(N, rp, w, helix, hole = 0) {
  const m = (2 * rp) / N, ra = rp + m, rf = rp - 1.2 * m, p = (PI * 2) / N, s = new T.Shape();

    pts.forEach(([r, a], k) => { const x = Math.cos(a) * r, y = Math.sin(a) * r; if (i === 0 && k === 0) s.moveTo(x, y); else s.lineTo(x, y); });
  }
  s.closePath();
  if (hole) { const h = new T.Path(); h.absarc(0, 0, hole, 0, PI * 2, true); s.holes.push(h); }
  const g = new T.ExtrudeGeometry(s, { depth: w, steps: 6, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.005, bevelSegments: 1, curveSegments: 16 });
  g.translate(0, 0, -w / 2);
  const tw = (Math.tan(helix) * w) / rp, pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), a = (z / w) * tw, c = Math.cos(a), sn = Math.sin(a); pos.setXY(i, x * c - y * sn, x * sn + y * c); }
  g.computeVertexNormals();

}
const exZ = (shape, depth, bev = 0.012, segs = 1) => { const g = new T.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: segs, curveSegments: 12 }); g.translate(0, 0, -depth / 2); return g; };

/* ---------- the gripper (Index): Varun's three-finger helical-gear gripper, refined into a production part ----------
   One inner helical gear on the gripper axis; three outer helical gears on pins at 120°, their axes crossed at 90° to it,
   so all three turn together; each outer gear carries a blue finger that curves inward toward its tip, closing like a chuck.
   An SG90 inside the wrist shroud drives the inner gear from the side through a raised "reflected" helical gear. */
function buildGripper(gp) {
  const CH = worn(P({ color: 0x24262a, clearcoat: 0.18, clearcoatRoughness: 0.5, bumpMap: peel, bumpScale: 0.12 }), { base: 0.48, prints: 4, scratches: 40, dust: 200, seed: 70, bump: 0.04 });
  const GR = worn(P({ color: 0x585c64, metalness: 0.25, clearcoat: 0.4, clearcoatRoughness: 0.28 }), { base: 0.34, prints: 2, scratches: 30, seed: 71, bump: 0.03 });
  const FB = worn(P({ color: 0x1b39a6, metalness: 0.65, clearcoat: 0.25, clearcoatRoughness: 0.35 }), { base: 0.33, prints: 5, scratches: 120, seed: 72, bump: 0.05 });
  // wrist shroud: continues the J7 form and flares into the chamber; the servo lives inside it
  ringAt(gp, "y", 0.295, 0.03, "index-cabinet", 0.026);
  add(gp, shell([[0.288, 0.0], [0.29, 0.08], [0.31, 0.2], [0.37, 0.32], [0.45, 0.4], [0.47, 0.44]], 0, 0.03), BLACK);
  // chamber deck: a filleted disc with a bolt circle
  const Y0 = 0.44;
  add(gp, lathe([[0, Y0], [0.46, Y0], [0.478, Y0 + 0.012], [0.482, Y0 + 0.035], [0.47, Y0 + 0.058], [0.45, Y0 + 0.064], [0, Y0 + 0.064]], 72), CH);
  for (let i = 0; i < 6; i++) { const a = (i / 6) * PI * 2 + PI / 6; screw(gp, Math.sin(a) * 0.405, Y0 + 0.064, Math.cos(a) * 0.405, 0.55); }
  const YG = Y0 + 0.064, RI = 0.2, RO = 0.17, YC = YG + 0.21, D = RI + RO;
  // inner helical gear on the axis, with its pin and cap
  const inner = add(gp, (() => { const g = gearGeo(20, RI, 0.36, PI / 4); g.rotateX(-PI / 2); return g; })(), GR, 0, YC, 0);
  add(gp, new T.CylinderGeometry(0.035, 0.035, 0.5, 24), STEEL, 0, YC + 0.02, 0);
  // the servo's raised reflected gear, meshing side by side with the inner gear, under a tidy guard
  const SA = PI / 3, sr = 0.09, sx = Math.sin(SA) * (RI + sr), sz = Math.cos(SA) * (RI + sr);
  add(gp, new T.CylinderGeometry(0.05, 0.06, 0.07, 24), CH, sx, YG + 0.035, sz);
  const sg = add(gp, (() => { const g = gearGeo(10, sr, 0.13, -PI / 4); g.rotateX(-PI / 2); return g; })(), GR, sx, YG + 0.14, sz);
  { const gd = grp(gp, sx, YG, sz); gd.rotation.y = SA; const w = add(gd, new T.CylinderGeometry(0.15, 0.15, 0.22, 32, 1, true, -PI / 2 - 0.2, PI + 0.4), CH, 0, 0.11, 0); w.material = CH.clone(); w.material.side = T.DoubleSide; }
  // three chambers at 120°: a pair of chamfered side frames (clevis) holding each outer gear's pin
  const oct = poly([[0.22, -0.22], [0.5, -0.22], [0.6, -0.12], [0.6, 0.14], [0.5, 0.24], [0.22, 0.24], [0.2, 0.2], [0.2, -0.18]]);
  const octG = exZ(oct, 0.034, 0.012, 3);
  const vc = canvasTex(256, 128, (g, W, H) => { g.fillStyle = "rgba(160,166,176,.55)"; g.font = "600 70px 'DM Mono', monospace"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("V.C.", W / 2, H / 2 + 4); });
  const hub = new T.Shape(); hub.absarc(0, 0, 0.1, 0, PI * 2, false);
  const outers = [];
  for (let k = 0; k < 3; k++) {
    const S0 = grp(gp, 0, YC, 0); S0.rotation.y = (k / 3) * PI * 2;
    for (const z of [-0.098, 0.098]) add(S0, octG, CH, 0, 0, z);
    // pin through the gear centre with caps outside the frames
    { const pn = add(S0, new T.CylinderGeometry(0.03, 0.03, 0.27, 20), STEEL, D, 0, 0); pn.rotation.x = PI / 2; for (const z of [-0.125, 0.125]) { const c = add(S0, new T.CylinderGeometry(0.048, 0.048, 0.018, 24), OXIDE, D, 0, z); c.rotation.x = PI / 2; } }
    // the Y-hub spoke tying the frames together above the inner gear
    add(S0, rounded(0.31, 0.06, 0.25, 0.025, 3), CH, 0.095, 0.25, 0);
    if (k === 0) { const m = add(S0, new T.PlaneGeometry(0.16, 0.08), S({ map: vc, transparent: true, roughness: 0.55, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }), 0.43, -0.12, 0.1155, false); m.castShadow = false; }
    // the outer gear and its finger turn together on the pin
    const F = grp(S0, D, 0, 0);
    add(F, gearGeo(18, RO, 0.12, PI / 4, 0.03), GR, 0, 0, 0);
    // the finger curves gently inward toward its tip
    const FL = 1.0, cxf = (y) => -0.19 * Math.pow(Math.max(0, y) / FL, 1.7), hwf = (y) => 0.072 - 0.026 * Math.min(1, Math.max(0, y) / FL);
    const eo = [], ei = [];
    for (let i = 0; i <= 18; i++) { const y = -0.02 + ((FL + 0.02) * i) / 18; eo.push([cxf(y) + hwf(y), y]); ei.push([cxf(y) - hwf(y), y]); }
    const beam = poly([...eo, ...ei.reverse()]);
    add(F, exZ(beam, 0.09, 0.018, 3), FB, 0, 0, 0);
    add(F, exZ(hub, 0.1, 0.01, 2), FB, 0, 0, 0);
    outers.push(F);
  }
  const anchor = new T.Object3D(); anchor.position.set(0, YC + 0.55, 0); gp.add(anchor);
  const tip = new T.Object3D(); tip.position.set(0, YC + 0.62, 0); gp.add(tip);
  return {
    anchor, tip, outers,
    set(close) {   // 0 open .. 1 shut: every outer gear turns the same way, the inner and servo gears turn in step
      const phi = -0.5 + close * 0.5;
      outers.forEach((f) => f.rotation.z = phi);
      inner.rotation.y = -phi * (18 / 20) + 0.08;
      sg.rotation.y = phi * (18 / 20) * (20 / 10) + 0.2;
    },
  };
}

const LU = 0.81 + 2.9, LF = 0.71 + 2.6, LT = 0.47 + 0.248 + 1.15 * 1.334, LAT = 0.95 - 0.94 + 0.72;
const PHI = 2.0;   // the tool comes at a handle from above, about 25° down from level, like a hand reaching for a low drawer
// inverse kinematics: the point between the fingers on a world point, the tool pitched PHI and pointing away from the base
function reachPt(P, near) {
  ARM.G[1].getWorldPosition(fSh);

// where the fingers go for a drawer pulled out by `open` (0..1): `off` back from its bar along the tool's own axis
const fU = new T.Vector3();
function handleAt(id, open, off) {

// a job's whole motion is a pure function of time, so the page and the collision audit run the very same path:

    case 3: { const o = J.o0 + (J.o1 - J.o0) * k; return { q: J.ikAt(o, STAND), g: HOLDG, open: o, seg: 3 }; }

function startJob(mode, id, next, el) {

}
function finishFetch(skip) {

  const target = f.mode === "out" ? f.id : f.next ? f.next.id : null;
  const show = (e) => { if (e) { e.style.opacity = ""; e.style.pointerEvents = ""; e.classList.add("in"); } };
  if (skip) {
    openId = target; snapDrawers = true;
    show(f.mode === "out" ? f.el : f.next && f.next.el);
    const P1 = target ? POSE[target] : HOME;
    for (let i = 0; i < 7; i++) { q[i] = P1.q[i]; qv[i] = 0; } gq = P1.g; gv = 0; dK = 1; snapCam = true;
    return;
  }
  for (let i = 0; i < 7; i++) { q[i] = f.qL[i]; qv[i] = 0; } gq = gShown; gv = 0;
  if (f.mode === "out") { openId = f.id; show(f.el); }

// any tap or key during a fetch jumps to its end
addEventListener("pointerdown", () => { if (FX) FX.skip = true; }, true);
addEventListener("keydown", () => { if (FX) FX.skip = true; }, true);
function stepFetch(dt) {
  const f = FX; f.t += dt;
  if (f.skip) { finishFetch(true); return null; }
  const r = jobAt(f, Math.min(f.t, f.end));
  ARM.cab.set(f.id, r.open); f.qL = r.q; gShown = r.g;
  if (f.mode === "out" && r.seg >= 4 && f.el && !f.shown) { f.shown = true; f.el.style.opacity = ""; f.el.style.pointerEvents = ""; f.el.classList.add("in"); }

/* poses: [J1..J7] + gripper close; and where the camera stands for each section */
const HOME = { q: [-0.72, 0.55, 0.06, 1.9, -0.1, 0.7, 0.2], g: 0.45, at: [-1.2, 3.25, 0.9], az: 0.32, el: 0.18, d: 17.3 };
// with a section open the arm turns a little toward you, off the open drawer, and moves the joint whose ring lights
const POSE = {
  "index-cabinet": { q: [-0.25, 0.55, 0.06, 1.9, -0.1, 0.42, 0.9], g: 0.15, at: "index-cabinet", az: 0.35, el: 0.34, d: 8.4 },   // gripper: wrist tips it up, fingers open
  fetch:   { q: [-0.65, 0.55, 0.06, 1.9, -0.1, 0.7, 0.2], g: 0.45, at: "j1", az: 0.62, el: 0.24, d: 8.4 },                     // J1: the column turns
  ceres:   { q: [-0.25, 0.15, 0.06, 1.9, -0.1, 1.09, 0.2], g: 0.45, at: "ceres", az: -0.55, el: 0.16, d: 8.4 },                  // J2: the shoulder leans back
  sweeper: { q: [-0.25, 0.55, 0.5, 1.9, -0.1, 0.7, 0.2], g: 0.45, at: "sweeper", az: -0.25, el: 0.16, d: 8.6 },                // J3: the upper arm rolls
  recall:  { q: [-0.25, 0.55, 0.06, 1.5, -0.1, 1.09, 0.2], g: 0.45, at: "recall", az: 0.75, el: 0.14, d: 8.6 },                // J4: the elbow opens (the wrist levels the tool)
  builds:  { q: [-0.25, 0.55, 0.06, 1.9, 0.6, 0.7, 0.2], g: 0.45, at: "builds", az: 0.95, el: 0.22, d: 8.4 },                  // J5: the forearm rolls
  software:{ q: [-0.25, 0.55, 0.06, 1.9, -0.1, 0.3, 0.2], g: 0.45, at: "software", az: -0.5, el: 0.2, d: 8 },                  // J6: the wrist pitches the tool out
  now:     { q: [-0.25, 0.55, 0.06, 1.9, -0.1, 0.7, 1.6], g: 0.45, at: "now", az: 0.2, el: 0.12, d: 7.6 },                     // J7: the wrist rolls
  awards:  { q: [-0.25, 0.35, 0.06, 1.6, -0.1, 1.2, 0.2], g: 0.45, at: "plate", az: -0.12, el: 0.2, d: 9.5 },                   // base: the arm stands tall over its plate
};
// idle: one long, calm reach-and-fold (shoulder, elbow and wrist together), plus each joint's own slow sway
// with a section open (desktop): the camera swings round to the front-right, so the cabinet sits behind the arm and faces you,
// and the whole bench fits between the column and the panel without shrinking the arm
const BENCH = { at: [-3.6, 2.8, 0.3], az: 0.32, el: 0.2, d: 30 }, BENCH_X = 0.112;
const PHONE_HOME_D = 2.15;   // phones: home pulls back so the arm and the whole cabinet fit the narrow screen
const REACH = 30;                       // seconds per full extend-and-fold
const FOLD = [0, 0.2, 0, -0.55, 0, 0.32, 0];
const DRIFT = [[0.14, 34, 0.2], [0.05, 17, 1.1], [0.22, 21, 2.3], [0.06, 13, 0.4], [0.3, 25, 1.7], [0.12, 15, 2.9], [0.7, 27, 0.8]];
const q = HOME.q.slice(), qv = q.map(() => 0); let gq = HOME.g, gv = 0, idleK = 1, glowK = 0;
function anchorPos(name, out) { const a = name && anchors[name]; if (a) a.getWorldPosition(out); else out.set(...HOME.at); return out; }

let phone = K.phone();
function size() { phone = K.phone(); if (G) G.size(innerWidth, innerHeight); }
size(); addEventListener("resize", size);

// theme easing: everything colour-related lerps from where it is to the room's values
const thFrom = {}, col = (h) => new T.Color(h);
let thMix = themeNow() === "light" ? 1 : 0;
function applyTheme(m, init) {
  const A = THEMES.dark, B = THEMES.light, c = (k) => col(A[k]).lerp(col(B[k]), m), n = (k) => A[k] + (B[k] - A[k]) * m;
  if (G) { scene.background.copy(c("bg")); scene.fog.color.copy(c("bg")); G.r.toneMappingExposure = n("exp"); scene.environmentIntensity = n("env"); }
  Lt.key.color.copy(c("key")); Lt.key.intensity = n("keyP"); Lt.fill.color.copy(c("fill")); Lt.fill.intensity = n("fillP"); Lt.rim.color.copy(c("rim")); Lt.rim.intensity = n("rimP"); rim2.color.copy(c("rim2")); rim2.intensity = n("rim2P");
  glow.color.copy(c("glow"));
  for (const s of SECS) { ringMats[s.id].color.copy(c("ring")); ringMats[s.id].emissive.copy(c("ringE")); }
  if (ARM) ARM.cab.acc.color.copy(c("ring"));

}
applyTheme(thMix, true);

const camP = new T.Vector3(), camT = new T.Vector3(), wantT = new T.Vector3(), wantP = new T.Vector3(), tmp = new T.Vector3();
let camInit = false, shiftX = 0, shiftY = 0;
const t0 = performance.now(); let last = t0, frames = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000, rm = RM(), P0 = (sel && POSE[sel]) || HOME;
  // critically damped springs toward the pose (about 1.2 s), sub-stepped so slow frames stay stable
  const w = 5.2;
  for (let left = dt; left > 1e-5; left -= 0.033) {
    const h = Math.min(0.033, left);
    for (let i = 0; i < 7; i++) { const a = w * w * (P0.q[i] - q[i]) - 2 * w * qv[i]; qv[i] = Math.max(-VMAX[i], Math.min(VMAX[i], qv[i] + a * h)); q[i] += qv[i] * h; }

  }
  if (rm) { for (let i = 0; i < 7; i++) { q[i] = P0.q[i]; qv[i] = 0; } gq = P0.g; }

  const fx = FX ? stepFetch(dt) : null;
  dK = follow(dK, fx ? 0 : 1, dt, fx ? 9 : 2.5);
  const qs = fx ? fx.qF : q;
  const reach = Math.sin((t / REACH) * PI * 2);
  ARM.G.forEach((g, i) => { const [A, per, ph] = DRIFT[i]; const v = qs[i] + idleK * dK * (FOLD[i] * reach + A * (Math.sin((t / per) * PI * 2 + ph) + 0.25 * Math.sin((t / per) * PI * 4.3 + ph * 2))); const vc = clampQ(v, i); if (g.userData.ax === "y") g.rotation.y = vc; else g.rotation.x = vc; });

  const asp = innerWidth / innerHeight, far = Math.pow(Math.max(1, 1.02 / asp), 0.62);
  const d = PC.d * (cs && cs !== "awards" ? 1.14 : 1) * far * (phone ? (cs ? (cs === "awards" ? 1.6 : 1.2) : PHONE_HOME_D) : 1);

  else { const k = 1 - Math.exp(-dt * 2.4); camP.lerp(wantP, k); camT.lerp(wantT, k); }
  if (G) {

    cam.lookAt(camT);

    // desktop: the arm stands in the space right of the column; with a section open, between the column and the panel
    const sx = phone ? (cs ? 0 : -W * 0.25) : open ? BENCH_X * W : -col / 2 - W * 0.155;
    const sy = phone ? (cs ? H * (cs === "awards" ? 0.21 : 0.22) : -H * 0.02) : 0;
    shiftX = rm || frames < 2 || snapCam ? sx : follow(shiftX, sx, dt, 3); shiftY = rm || frames < 2 || snapCam ? sy : follow(shiftY, sy, dt, 4);
    snapCam = false;
    cam.setViewOffset(W, H, shiftX, shiftY, W, H);
  }
  // the room eases between dark and light in about 400 ms
  const tm = themeNow() === "light" ? 1 : 0;
  if (Math.abs(thMix - tm) > 1e-4) { thMix = rm ? tm : follow(thMix, tm, dt, 9); if (Math.abs(thMix - tm) < 0.002) thMix = tm; applyTheme(thMix); }
  // the selected joint's ring glows and lights the shells around it
  for (const s of SECS) { const m = ringMats[s.id], to = s.id === sel ? 2.4 : 0.06; m.emissiveIntensity = rm ? to : follow(m.emissiveIntensity, to, dt, 5); }

  glow.intensity = glowK * 1.6;
  if (G) G.draw();
  if (++frames === 2) { const v = $("#veil"), wait = new Promise((ok) => setTimeout(ok, 900)); Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), wait]).then(() => setTimeout(() => v.classList.add("off"), 60)); }   // a slow font never holds the page blank
}
requestAnimationFrame(loop);

/* tapping a joint opens its section */
const ray = new T.Raycaster(), ndc = new T.Vector2();
function pick(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObject(ARM.root, true).find((h) => h.object.userData.sec);
  return hit ? hit.object.userData.sec : null;
}
let down = null;
stage.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
stage.addEventListener("pointerup", (e) => { if (!down) return; const d = down; down = null; if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) return; const id = pick(e); if (id) K.go(id); else if (route) K.go(""); });
let hovT = 0;
stage.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse" || performance.now() - hovT < 90) return; hovT = performance.now(); const id = pick(e); stage.style.cursor = id ? "pointer" : "default"; hoverId = id; });
stage.addEventListener("pointerleave", () => { hoverId = null; });
// keyboard: focusing a section in the (visually hidden) list points at its drawer
tabsEl.addEventListener("focusin", (e) => { const a = e.target.closest("a"); hoverId = a ? a.dataset.id : null; });
tabsEl.addEventListener("focusout", () => { hoverId = null; });

K.onRoute((r) => show(r)); booted = true;
</script>
