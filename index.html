<noscript><main style="max-width:680px;margin:0 auto;padding:24px"><h1>Varun Chilukuri</h1><p>I build robots, mechatronics and embedded systems, mostly at hackathons. Student at Leland High, San Jose.</p><section><h2>Index</h2><p>Solo · 1st Overall, Bay Valley Hacks</p><img src="images/index-1.jpg" alt="Index, a robotic cabinet with 15 compartments on a 3-axis gantry, next to the laptop running its voice agent" style="max-width:100%"><p>A voice-controlled robotic cabinet. Ask for what you need, by voice or from your phone, and a 3-axis robot pulls the exact tray out of 15 compartments, brings it within reach, and puts it back when you&#x27;re done. Made for people who can&#x27;t easily reach, search or remember, for about $300 in parts.</p><p>The AI voice agent can only act through verified commands: the page sends GO n, and the robot has to answer ACK n or the move is rejected. It only offers what&#x27;s in stock and moves only after you say yes.</p><p>Controller: Maker-ESP32 with its own Wi-Fi and phone page</p><p>Motion: X and Z steppers on belts and linear rails; servo rack and pinion for depth</p><p>Gripper: Electromagnet onto a steel washer in each 3D-printed tray</p><p>Voice: ElevenLabs agent with three client tools</p><p><a href="https://github.com/vrun-systems26/IndeX">GitHub ↗</a></p><p><a href="https://index-robot-cabinet.vercel.app">Live ↗</a></p><p><a href="https://youtu.be/VH-3CrXZQcE">Demo ↗</a></p></section><section><h2>Fetch</h2><p>Co-founder · hardware lead · CSI Hacks</p><img src="images/fetch-1.jpg" alt="Fetch, a mecanum-drive robot with a trash-can body, on a tile floor" style="max-width:100%"><p>A trash can that drives itself to whoever calls it, finding its way with AprilTags instead of lidar. Built in about 8 hours; I did the CAD, electronics and hardware.</p><p>Compute: Pi 4 + Arduino Uno R4</p><p>Drive: 4× NEMA 17, mecanum</p><p>Navigation: AprilTag + QR, ultrasonic e-stop</p><p><a href="https://github.com/vrun-systems26/Fetch-CSI-Hacks">GitHub ↗</a></p><p><a href="https://devpost.com/varunchilukuri7">Devpost ↗</a></p></section><section><h2>Ceres</h2><p>Co-founder · hardware lead · Berkeley Robotics Hackathon</p><img src="images/ceres-1.jpg" alt="Ceres agriculture robot, four-wheel chassis with pan-tilt camera mount" style="max-width:100%"><p>An affordable crop-scouting robot that spots diseased leaves with a VLM we trained, and probes the soil with a rack-and-pinion arm. Built in about 7 hours; I did the hardware.</p><p>Compute: Pi 4 + Arduino Mega</p><p>Drive: 4WD, dual L298N</p><p>Sensing: MG996R pan-tilt camera, STEMMA soil probe</p><p><a href="https://github.com/vrun-systems26/Ceres/tree/master">GitHub ↗</a></p><p><a href="https://www.youtube.com/watch?v=oX8thTSngGY">Demo ↗</a></p></section><section><h2>Street Sweeper</h2><p>Team of 4 · hardware &amp; electronics · Milpitas Hacks</p><img src="images/street-sweeper-1.jpg" alt="Street Sweeper robot with a phone mounted as its camera" style="max-width:100%"><p>A trash-collecting robot you drive by typing commands, so playing with it doubles as a coding lesson.</p><p>Compute: ESP32</p><p>Drive: L298N, two-wheel drive</p><p>Intake: Camera-guided</p><p><a href="https://github.com/vrun-systems26/Street-Sweeper-Milpitas-Hacks">GitHub ↗</a></p></section><section><h2>Arrival</h2><p>Team of 30 · people &amp; safety lead · Nebius × NVIDIA AI Hackathon</p><img src="images/arrival-1.jpg" alt="One iPhone scan of a kitchen drawn up as a floor plan, with the scan path" style="max-width:100%"><p>One iPhone scan of a kitchen becomes a physics twin, a robot arm working around walking people, and a dataset NVIDIA GR00T trains on. Fine-tuned on it, GR00T passed 39 of 48 trials, up from 26. I stress-tested every room (288 of 288 runs, zero contacts with people), hunted down bugs and gaps, and recorded much of the demo video.</p><p>Led: People &amp; safety</p><p>Built: RoboCasa layouts within 2.5 cm; 104 demos from 14 human ones</p><p>Fixed: Walker contacts 3 → 0; Franka oven 12/14 → 14/14</p><p>Shipped: 41 of 418 merged PRs</p><p><a href="https://github.com/AvnehSBhatia/ExeaLabsNvidiaHacks">GitHub ↗</a></p><p><a href="https://arrival.exealabs.org">Live ↗</a></p><p><a href="https://www.youtube.com/watch?v=EdZCukpGx00">Demo ↗</a></p></section><section><h2>HocDiuTempusSumpsit</h2><p>Solo · Bluetooth robotic arm</p><img src="images/arm-2.jpg" alt="HocDiuTempusSumpsit robotic arm with its wireless remote" style="max-width:100%"><p>A 4-bar linkage arm with a three-finger helical-gear gripper. When the elbow couldn&#x27;t hold the load, I reworked the joint geometry instead of buying a bigger servo.</p><p>Control: 2× ESP-WROOM-32 + PCA9685, BLE</p><p>Servos: MG996R, SG90, A330</p><p><a href="https://github.com/vrun-systems26/Bluetooth-Robotic-Arm">GitHub ↗</a></p></section><section><h2>The Eclipse Lamp</h2><p>Covert hardware</p><img src="images/eclipse-lamp-device.jpg" alt="The Eclipse Lamp internals, Raspberry Pi, gears, and 3D-printed shutter housing" style="max-width:100%"><p>Looks like a normal lamp. Inside, a motorized shutter and a sweeping camera spot people and alert your phone.</p><p><a href="https://github.com/vrun-systems26/The-Eclipse-Lamp">GitHub ↗</a></p></section><section><h2>MagLift</h2><p>Solo · science fair</p><img src="images/maglift.jpg" alt="MagLift science fair board with the magnetic crane prototype" style="max-width:100%"><p>A magnetic crane prototype with joystick and touch-pad control. Designed, built and coded solo.</p></section><section><h2>MARS-61</h2><p>Concept · on hold</p><img src="images/mars61.jpg" alt="MARS-61 herringbone gear reduction next to its NEMA 17 drive motor" style="max-width:100%"><p>A heavy arm with a dual NEMA 17 shoulder and a custom 5:17 herringbone reduction. On hold, not forgotten.</p></section><section><h2>Gaming Mouse</h2><p>Built from scratch</p><img src="images/gaming-mouse.jpg" alt="Custom gaming mouse CAD model with a hex-vented shell" style="max-width:100%"><p>A mouse on a XIAO ESP32-S3 with an optical sensor, LiPo power, and arrow keys built into the shell.</p><p><a href="https://github.com/vrun-systems26/Custom-Gaming-Mouse">GitHub ↗</a></p></section><section><h2>WattWatch</h2><p>Non-invasive current sensing · ESP32</p><img src="images/wattwatch-1.jpg" alt="WattWatch PCB 3D render with the ESP32 module, current-sense, alarm and LED sections" style="max-width:100%"><p>Clips onto an appliance&#x27;s power cord, with no wiring cut, and checks the current it draws against whether anyone is in the room. Left on in an empty room, it sounds an alarm and sends a push to your phone.</p><p>Sensing: SCT-013 current clamp, PIR motion</p><p>Compute: ESP32, true-RMS sampling</p><p>Alerts: Buzzer, OLED, WiFi push</p><p>Board: KiCad schematic + PCB, ERC/DRC clean</p><p><a href="https://github.com/vrun-systems26/WattWatch">GitHub ↗</a></p></section><section><h2>Dial</h2><p>Voice payments on Mantle</p><img src="images/dial-1.jpg" alt="Dial home page: send money home with one phone call" style="max-width:100%"><p>Send money home by talking to a voice agent in your own language. The dollars lock on the Mantle blockchain in seconds, family picks up cash at a corner shop with a 6-digit code, and anything left uncollected is refunded automatically. No smartphone, bank or app needed on either side.</p><p>Voice: ElevenLabs agent, Gemini 2.5 Flash</p><p>Chain: Solidity checks contract on Mantle</p><p>Server: Node + Express on Vercel</p><p><a href="https://github.com/vrun-systems26/Dial">GitHub ↗</a></p><p><a href="https://dial-a-dollar.vercel.app">Live ↗</a></p></section><section><h2>Recall</h2><p>Solo · speech AI for early signs of dementia</p><img src="images/recall-1.jpg" alt="Recall&#x27;s result for one check-in: a speech-change score and the markers outside the typical range" style="max-width:100%"><p>A two-minute daily voice check-in for an aging parent. A friendly voice asks one question, the parent answers out loud, and Recall scores how they spoke: pauses, word-finding gaps, vague words, vocabulary. The family watches the trend over weeks and raises a lasting change with a doctor.</p><p>The models that scored highest had learned the recordings, not the people, and failed a sanity check I built. I shipped the best model that passed. A prototype, not medical advice.</p><p>Data: 450 public interview clips, 215 people (DementiaNet)</p><p>Speech: faster-whisper transcript, 17 speech markers</p><p>Model: Knowledge-guided markers + MiniLM ensemble</p><p>Testing: No speaker in both train and test; synthetic sanity check</p><p><a href="https://github.com/vrun-systems26/recall">GitHub ↗</a></p></section><h2>Currently</h2><p>Quicksilver 604: My school&#x27;s robotics team. I also volunteer teaching LEGO robotics to elementary and middle schoolers.</p><p>Synopsys Championship: Structure-Borne Vibration Communication and Localization for In-Pipe Inspection Robots</p><p>Hackathon Club: Co-founder and vice president. About 40 members; we teach students to build projects and win hackathons.</p><p><a href="https://almadenhacks.com/">Almaden Hacks</a>: Helping host this high school hackathon for software and hardware projects in San Jose.</p><p>Speech &amp; Debate: Public forum and impromptu.</p><h2>Awards</h2><p>1st Overall, Bay Valley Hacks: Index · 400+ hackers</p><p>1st Overall, CSI Hacks: Fetch · 82+ teams</p><p>Top 30 High Honors, Veritas AI International High School Hackathon: Recall · solo · shortlisted in the top 30 of 1,000+ projects, 1,700+ students, 75+ countries · $1,250 scholarship</p><p>2nd Open Hardware, Berkeley Robotics Hackathon: Ceres · 80+ teams, high schoolers only</p><p>2nd Interactive Learning, Milpitas Hacks: Street Sweeper · 220+ participants</p><p>2nd Leland High School Science Fair: MagLift · 30+ submissions</p><p>1st Dan black belt, Taekwondo: Testing for 2nd Dan in December</p><p><a href="https://github.com/vrun-systems26">GitHub</a></p><p><a href="https://www.linkedin.com/in/varunchilukuri26/">LinkedIn</a></p><p><a href="https://devpost.com/varunchilukuri7">Devpost</a></p></main></noscript>
